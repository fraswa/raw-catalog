name: Verify Fast SMB and persistent ExifTool
on:
  push:
permissions:
  contents: write
jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Fast SMB option
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/worker.py')
          s = p.read_text()
          old = "from app.imaging import EXTENSIONS, metadata_batch, make_previews, make_thumbnail, make_preview, cache_file\n"
          new = "from app.imaging import (EXTENSIONS, metadata_batch, make_previews, make_thumbnail, make_preview,\n                         cache_file, close_exiftool_sessions)\n"
          assert old in s
          s = s.replace(old, new, 1)
          old = "SCAN_SKIP_IMPORTED_PREFIX = 'scan_skip_imported:'\nSCAN_PARALLELISM_PREFIX = 'scan_parallelism:'\n"
          new = "SCAN_SKIP_IMPORTED_PREFIX = 'scan_skip_imported:'\nSCAN_SKIP_POST_STAT_PREFIX = 'scan_skip_post_stat:'\nSCAN_PARALLELISM_PREFIX = 'scan_parallelism:'\n"
          assert old in s
          s = s.replace(old, new, 1)
          marker = "def job_skip_imported(job_id):\n    with Session() as db:\n        setting = db.get(Setting, SCAN_SKIP_IMPORTED_PREFIX + str(job_id))\n        return bool(setting and setting.value == '1')\n\n\n"
          addition = marker + "def job_skip_post_stat(job_id):\n    with Session() as db:\n        setting = db.get(Setting, SCAN_SKIP_POST_STAT_PREFIX + str(job_id))\n        return bool(setting and setting.value == '1')\n\n\n"
          assert marker in s
          s = s.replace(marker, addition, 1)
          old = "    skip_previews = job_skip_previews(job_id)\n    skip_imported = job_skip_imported(job_id)\n    parallelism = job_parallelism(job_id)\n"
          new = "    skip_previews = job_skip_previews(job_id)\n    skip_imported = job_skip_imported(job_id)\n    skip_post_stat = job_skip_post_stat(job_id)\n    parallelism = job_parallelism(job_id)\n"
          assert old in s
          s = s.replace(old, new, 1)
          old = "            after = path.stat()\n            if (stat.st_size, stat.st_mtime_ns) != (after.st_size, after.st_mtime_ns):\n                raise ValueError('File changed during indexing; retry next scan')\n"
          new = "            if not skip_post_stat:\n                after = path.stat()\n                if (stat.st_size, stat.st_mtime_ns) != (after.st_size, after.st_mtime_ns):\n                    raise ValueError('File changed during indexing; retry next scan')\n"
          assert old in s
          s = s.replace(old, new, 1)
          old = "        if skip_imported:\n            notes.append('already imported paths skipped')\n        notes.append(f'{parallelism} parallel worker' + ('s' if parallelism != 1 else ''))\n"
          new = "        if skip_imported:\n            notes.append('already imported paths skipped')\n        if skip_post_stat:\n            notes.append('fast SMB mode')\n        notes.append(f'{parallelism} parallel worker' + ('s' if parallelism != 1 else ''))\n"
          assert old in s
          s = s.replace(old, new, 1)
          old = "        if skip_imported:\n            completion.append('existing source paths were skipped')\n        suffix = (' — ' + '; '.join(completion)) if completion else ''\n"
          new = "        if skip_imported:\n            completion.append('existing source paths were skipped')\n        if skip_post_stat:\n            completion.append('post-read source verification was skipped')\n        suffix = (' — ' + '; '.join(completion)) if completion else ''\n"
          assert old in s
          s = s.replace(old, new, 1)
          old = "    except Exception as exc:\n        state, message = 'failed', str(exc)\n        log.exception('Scan failed')\n    with Session.begin() as db:\n"
          new = "    except Exception as exc:\n        state, message = 'failed', str(exc)\n        log.exception('Scan failed')\n    finally:\n        close_exiftool_sessions()\n    with Session.begin() as db:\n"
          assert old in s
          s = s.replace(old, new, 1)
          old = "                    SCAN_SKIP_IMPORTED_PREFIX + str(job_id), SCAN_PARALLELISM_PREFIX + str(job_id)):\n"
          new = "                    SCAN_SKIP_IMPORTED_PREFIX + str(job_id), SCAN_SKIP_POST_STAT_PREFIX + str(job_id),\n                    SCAN_PARALLELISM_PREFIX + str(job_id)):\n"
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('app/web.py')
          s = p.read_text()
          old = "SCAN_SKIP_IMPORTED_PREFIX = 'scan_skip_imported:'\nSCAN_PARALLELISM_PREFIX = 'scan_parallelism:'\n"
          new = "SCAN_SKIP_IMPORTED_PREFIX = 'scan_skip_imported:'\nSCAN_SKIP_POST_STAT_PREFIX = 'scan_skip_post_stat:'\nSCAN_PARALLELISM_PREFIX = 'scan_parallelism:'\n"
          assert old in s
          s = s.replace(old, new, 1)
          old = "    def queue_job(mode='scan', force=False, skip_previews=False, skip_imported=False, parallelism=1):\n"
          new = "    def queue_job(mode='scan', force=False, skip_previews=False, skip_imported=False,\n                  skip_post_stat=False, parallelism=1):\n"
          assert old in s
          s = s.replace(old, new, 1)
          old = "                    if mode == 'scan' and skip_imported:\n                        db.add(Setting(key=SCAN_SKIP_IMPORTED_PREFIX + str(job.id), value='1'))\n                    if mode == 'scan':\n"
          new = "                    if mode == 'scan' and skip_imported:\n                        db.add(Setting(key=SCAN_SKIP_IMPORTED_PREFIX + str(job.id), value='1'))\n                    if mode == 'scan' and skip_post_stat:\n                        db.add(Setting(key=SCAN_SKIP_POST_STAT_PREFIX + str(job.id), value='1'))\n                    if mode == 'scan':\n"
          assert old in s
          s = s.replace(old, new, 1)
          old = "                                      skip_imported=data.get('skip_imported') is True,\n                                      parallelism=data.get('parallelism', 1))), 202\n"
          new = "                                      skip_imported=data.get('skip_imported') is True,\n                                      skip_post_stat=data.get('skip_post_stat') is True,\n                                      parallelism=data.get('parallelism', 1))), 202\n"
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('app/static/indexer.html')
          s = p.read_text()
          marker = '<label class="option-row"><input id="force" type="checkbox"><span><strong>Force re-index existing photos</strong><small>Re-read metadata and regenerate requested media even when an existing photo appears unchanged. Mutually exclusive with Skip already imported.</small></span></label>\n'
          addition = marker + '<label class="option-row"><input id="skipPostStat" type="checkbox"><span><strong>Fast SMB mode</strong><small>Skip the second source-file stat after processing to reduce SMB round trips. The initial stat, metadata read and read-only protections remain. Source changes during processing are detected on the next scan instead.</small></span></label>\n'
          assert marker in s
          s = s.replace(marker, addition, 1)
          p.write_text(s)

          p = Path('app/static/indexer.js')
          s = p.read_text()
          old = "['browseFolder','parallelism','skipPreviews','skipImported','force','startScan']"
          new = "['browseFolder','parallelism','skipPreviews','skipImported','force','skipPostStat','startScan']"
          assert old in s
          s = s.replace(old, new, 1)
          old = "skip_imported:$('skipImported').checked,parallelism:Number($('parallelism').value)"
          new = "skip_imported:$('skipImported').checked,skip_post_stat:$('skipPostStat').checked,parallelism:Number($('parallelism').value)"
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('tests/test_preview_on_demand.py')
          s = p.read_text()
          s += "\n\ndef test_fast_smb_setting_is_recorded(client):\n    headers = {'X-CSRF-Token': client.csrf}\n    queued = client.post('/api/scan', json={'skip_post_stat': True, 'parallelism': 4}, headers=headers)\n    assert queued.status_code == 202\n    job_id = queued.json['scan']['id']\n    with Session() as db:\n        setting = db.get(Setting, f'scan_skip_post_stat:{job_id}')\n        assert setting is not None and setting.value == '1'\n"
          p.write_text(s)
          PY
      - name: Install dependencies and ExifTool
        run: |
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl
          pip install -r requirements.txt
          pip install pytest
      - name: Python tests
        run: python -m pytest -q
      - name: JavaScript syntax
        run: node --check app/static/indexer.js
      - name: Real persistent ExifTool test
        run: |
          python - <<'PY'
          from app.imaging import ExifToolSession
          session = ExifToolSession()
          first = session.execute(['-ver'], timeout=10).strip()
          pid = session._process.pid
          second = session.execute(['-ver'], timeout=10).strip()
          assert first and first == second
          assert session._process.pid == pid, 'ExifTool process was respawned instead of reused'
          print('ExifTool', first.decode(), 'persistent pid', pid)
          session.close()
          PY
      - name: Verify wiring
        run: |
          grep -q "SCAN_SKIP_POST_STAT_PREFIX" app/worker.py
          grep -q "if not skip_post_stat" app/worker.py
          grep -q "close_exiftool_sessions" app/worker.py
          grep -q "skip_post_stat=data.get" app/web.py
          grep -q "skipPostStat" app/static/indexer.html
          grep -q "_preview_exiftool" app/imaging.py
          grep -q -- "-stay_open" app/imaging.py
      - name: Commit verified changes and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/worker.py app/web.py app/static/indexer.html app/static/indexer.js tests/test_preview_on_demand.py
          git rm .github/workflows/verify-fast-smb-exiftool.yml
          git commit -m 'Add Fast SMB mode and persistent ExifTool sessions'
          git push
