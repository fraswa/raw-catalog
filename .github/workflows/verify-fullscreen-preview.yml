name: Verify fullscreen preview
on:
  push:
permissions:
  contents: write
jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check app/static/app.js
      - name: Verify fullscreen target
        run: |
          grep -q 'id="previewStage"' app/static/index.html
          grep -q "previewStage').requestFullscreen" app/static/app.js
          grep -q '.stage:fullscreen' app/static/style.css
          if grep -q "viewer').requestFullscreen" app/static/app.js; then exit 1; fi
      - name: Remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-fullscreen-preview.yml
          git commit -m 'Remove temporary fullscreen preview verification'
          git push
