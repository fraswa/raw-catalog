name: Verify parallel indexer
on:
  push:
permissions:
  contents: write
jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply parallel indexer changes
        run: |
          python - <<'PY'
          from pathlib import Path

          # Web API: validate/store per-scan parallelism.
          p = Path('app/web.py')
          s = p.read_text()
          s = s.replace(
              "SCAN_SKIP_IMPORTED_PREFIX = 'scan_skip_imported:'\n",
              "SCAN_SKIP_IMPORTED_PREFIX = 'scan_skip_imported:'\nSCAN_PARALLELISM_PREFIX = 'scan_parallelism:'\nPARALLELISM_VALUES = (1, 2, 4, 6, 8)\n"
          )
          s = s.replace(
              "    def queue_job(mode='scan', force=False, skip_previews=False, skip_imported=False):\n        if force and skip_imported:\n            abort(400, 'Force re-index and Skip already imported cannot be enabled together')\n",
              "    def queue_job(mode='scan', force=False, skip_previews=False, skip_imported=False, parallelism=1):\n        if force and skip_imported:\n            abort(400, 'Force re-index and Skip already imported cannot be enabled together')\n        try:\n            parallelism = int(parallelism)\n        except (TypeError, ValueError):\n            abort(400, 'Parallel processing must be one of 1, 2, 4, 6 or 8')\n        if parallelism not in PARALLELISM_VALUES:\n            abort(400, 'Parallel processing must be one of 1, 2, 4, 6 or 8')\n"
          )
          s = s.replace(
              "                    if mode == 'scan' and skip_imported:\n                        db.add(Setting(key=SCAN_SKIP_IMPORTED_PREFIX + str(job.id), value='1'))\n                    result = serialize_scan(job)\n",
              "                    if mode == 'scan' and skip_imported:\n                        db.add(Setting(key=SCAN_SKIP_IMPORTED_PREFIX + str(job.id), value='1'))\n                    if mode == 'scan':\n                        db.add(Setting(key=SCAN_PARALLELISM_PREFIX + str(job.id), value=str(parallelism)))\n                    result = serialize_scan(job)\n"
          )
          s = s.replace(
              "                                      skip_previews=data.get('skip_previews') is True,\n                                      skip_imported=data.get('skip_imported') is True)), 202\n",
              "                                      skip_previews=data.get('skip_previews') is True,\n                                      skip_imported=data.get('skip_imported') is True,\n                                      parallelism=data.get('parallelism', 1))), 202\n"
          )
          p.write_text(s)

          # Worker: run image decode/generation concurrently, keep DB writes on main thread.
          p = Path('app/worker.py')
          s = p.read_text()
          s = s.replace(
              "import time\nfrom datetime import datetime\n",
              "import time\nfrom concurrent.futures import ThreadPoolExecutor, as_completed\nfrom datetime import datetime\n"
          )
          s = s.replace(
              "SCAN_SKIP_IMPORTED_PREFIX = 'scan_skip_imported:'\n",
              "SCAN_SKIP_IMPORTED_PREFIX = 'scan_skip_imported:'\nSCAN_PARALLELISM_PREFIX = 'scan_parallelism:'\nPARALLELISM_VALUES = (1, 2, 4, 6, 8)\n"
          )
          marker = "def job_skip_imported(job_id):\n    with Session() as db:\n        setting = db.get(Setting, SCAN_SKIP_IMPORTED_PREFIX + str(job_id))\n        return bool(setting and setting.value == '1')\n\n\n"
          replacement = marker + "def job_parallelism(job_id):\n    with Session() as db:\n        setting = db.get(Setting, SCAN_PARALLELISM_PREFIX + str(job_id))\n    try:\n        value = int(setting.value) if setting else 1\n    except (TypeError, ValueError):\n        return 1\n    return value if value in PARALLELISM_VALUES else 1\n\n\n"
          if marker not in s:
              raise SystemExit('job_skip_imported marker not found')
          s = s.replace(marker, replacement, 1)
          s = s.replace(
              "    skip_previews = job_skip_previews(job_id)\n    skip_imported = job_skip_imported(job_id)\n\n    try:\n",
              "    skip_previews = job_skip_previews(job_id)\n    skip_imported = job_skip_imported(job_id)\n    parallelism = job_parallelism(job_id)\n\n    try:\n"
          )

          start = s.index("        def process(paths):\n")
          end = s.index("        root = selected_scan_root()\n", start)
          new_block = '''        def render_photo(item):
            path, path_hash, stat, meta = item
            if not meta or meta.get('Error'):
                raise ValueError((meta or {}).get('Error', 'No metadata returned'))
            camera, lens = labels(meta)
            key = digest(f'{path_hash}:{stat.st_mtime_ns}:{stat.st_size}')
            media_error = None
            try:
                if skip_previews:
                    make_thumbnail(path, meta, thumbnail_cache, key)
                else:
                    make_previews(path, meta, preview_cache, key, thumbnail_cache,
                                  preview_edge, preview_quality)
            except Exception as exc:
                media_error = str(exc)[:2000]
                log.warning('Generated media failed for %s: %s', path, exc)
            after = path.stat()
            if (stat.st_size, stat.st_mtime_ns) != (after.st_size, after.st_mtime_ns):
                raise ValueError('File changed during indexing; retry next scan')
            return dict(path=path, path_hash=path_hash, stat=stat, meta=meta, camera=camera,
                        lens=lens, key=key, media_error=media_error)

        def store_photo(result):
            path = result['path']
            stat = result['stat']
            with Session.begin() as db:
                photo = db.scalar(select(Photo).where(Photo.path_hash == result['path_hash']))
                if photo is None:
                    photo = Photo(path_hash=result['path_hash'])
                    db.add(photo)
                photo.path, photo.filename = str(path), path.name
                photo.size, photo.mtime_ns = stat.st_size, stat.st_mtime_ns
                photo.camera, photo.lens = result['camera'], result['lens']
                photo.taken_at, photo.metadata_json = capture_date(result['meta']), result['meta']
                photo.cache_key = result['key'] if not result['media_error'] else None
                photo.preview_error = result['media_error']
                photo.indexed_at = now()
            counts['indexed'] += 1
            if result['media_error']:
                counts['errors'] += 1

        def process(paths, executor):
            pending = []
            hashes = [digest(str(p)) for p in paths]
            with Session() as db:
                existing = {p.path_hash: p for p in db.scalars(select(Photo).where(Photo.path_hash.in_(hashes)))}
            for path, path_hash in zip(paths, hashes):
                old = existing.get(path_hash)
                if old and skip_imported:
                    counts['skipped'] += 1
                    continue
                try:
                    stat = path.stat()
                    preview_ok = skip_previews
                    thumb_ok = False
                    if old and old.cache_key:
                        if not skip_previews:
                            preview_ok = (cache_file(preview_cache, old.cache_key, 'preview').is_file() or
                                          cache_file(legacy_cache, old.cache_key, 'preview').is_file())
                        thumb_ok = (cache_file(thumbnail_cache, old.cache_key, 'thumb').is_file() or
                                    cache_file(legacy_cache, old.cache_key, 'thumb').is_file())
                    if old and not force and old.size == stat.st_size and old.mtime_ns == stat.st_mtime_ns and preview_ok and thumb_ok:
                        counts['skipped'] += 1
                    else:
                        pending.append((path, path_hash, stat))
                except OSError as exc:
                    counts['errors'] += 1
                    report(path, str(exc))
            report()
            if not pending:
                return
            try:
                metadata = metadata_batch([p for p, _, _ in pending])
            except Exception as exc:
                counts['errors'] += len(pending)
                report(message=f'Metadata batch failed: {exc}')
                return

            futures = {}
            for path, path_hash, stat in pending:
                item = (path, path_hash, stat, metadata.get(str(path)))
                futures[executor.submit(render_photo, item)] = path
            try:
                for future in as_completed(futures):
                    path = futures[future]
                    report(path)
                    try:
                        store_photo(future.result())
                    except Exception as exc:
                        counts['errors'] += 1
                        report(path, f'Could not index file: {exc}')
                        log.exception('Could not index %s', path)
            except InterruptedError:
                for future in futures:
                    future.cancel()
                raise
            report()

'''
          s = s[:start] + new_block + s[end:]
          s = s.replace(
              "        if skip_imported:\n            notes.append('already imported paths skipped')\n        report(message='Scanning folders' + (f\" ({', '.join(notes)})\" if notes else ''))\n        for directory, directories, filenames in os.walk(root, followlinks=False, onerror=walk_error):\n",
              "        if skip_imported:\n            notes.append('already imported paths skipped')\n        notes.append(f'{parallelism} parallel worker' + ('s' if parallelism != 1 else ''))\n        report(message='Scanning folders' + (f\" ({', '.join(notes)})\" if notes else ''))\n        with ThreadPoolExecutor(max_workers=parallelism, thread_name_prefix='raw-index') as executor:\n            for directory, directories, filenames in os.walk(root, followlinks=False, onerror=walk_error):\n"
          )
          # Re-indent walk body and route batches through executor.
          old_walk = '''            directories[:] = [d for d in directories if not Path(directory, d).is_symlink()]
            report(directory)
            for filename in filenames:
                path = Path(directory, filename)
                if path.suffix.lower() not in EXTENSIONS or path.is_symlink():
                    continue
                counts['discovered'] += 1
                pending.append(path)
                if len(pending) >= 64:
                    process(pending)
                    pending = []
        if pending:
            process(pending)
'''
          new_walk = '''                directories[:] = [d for d in directories if not Path(directory, d).is_symlink()]
                report(directory)
                for filename in filenames:
                    path = Path(directory, filename)
                    if path.suffix.lower() not in EXTENSIONS or path.is_symlink():
                        continue
                    counts['discovered'] += 1
                    pending.append(path)
                    if len(pending) >= 64:
                        process(pending, executor)
                        pending = []
            if pending:
                process(pending, executor)
'''
          if old_walk not in s:
              raise SystemExit('walk block marker not found')
          s = s.replace(old_walk, new_walk, 1)
          s = s.replace(
              "                    SCAN_SKIP_IMPORTED_PREFIX + str(job_id)):\n",
              "                    SCAN_SKIP_IMPORTED_PREFIX + str(job_id), SCAN_PARALLELISM_PREFIX + str(job_id)):\n"
          )
          p.write_text(s)

          # Indexer UI.
          p = Path('app/static/indexer.html')
          s = p.read_text()
          marker = '<div class="card-heading"><div><p class="eyebrow">OPTIONS</p><h2>Import behavior</h2></div></div>\n'
          addition = marker + '<label class="parallelism-row" for="parallelism"><span><strong>Parallel processing</strong><small>Concurrent RAW decode / generated-media workers. 4 is recommended for a 6-core CPU; reduce it if the server becomes unresponsive or storage is saturated.</small></span><select id="parallelism"><option value="1">1 worker</option><option value="2">2 workers</option><option value="4" selected>4 workers</option><option value="6">6 workers</option><option value="8">8 workers</option></select></label>\n'
          if marker not in s:
              raise SystemExit('indexer options marker not found')
          s = s.replace(marker, addition, 1)
          p.write_text(s)

          p = Path('app/static/indexer.js')
          s = p.read_text()
          s = s.replace(
              "for(const id of ['browseFolder','skipPreviews','skipImported','force','startScan'])",
              "for(const id of ['browseFolder','parallelism','skipPreviews','skipImported','force','startScan'])"
          )
          s = s.replace(
              "skip_imported:$('skipImported').checked})",
              "skip_imported:$('skipImported').checked,parallelism:Number($('parallelism').value)})"
          )
          p.write_text(s)

          p = Path('app/static/indexer.css')
          s = p.read_text()
          s += '.parallelism-row{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:center;padding:1rem 0;border-top:1px solid var(--line)}.parallelism-row strong,.parallelism-row small{display:block}.parallelism-row strong{font-size:.92rem;margin-bottom:.3rem}.parallelism-row small{font-size:.8rem;color:var(--muted);line-height:1.5;max-width:720px}.parallelism-row select{min-width:130px}@media(max-width:650px){.parallelism-row{grid-template-columns:1fr}.parallelism-row select{width:100%}}'
          p.write_text(s)

          # Permanent regression tests.
          p = Path('tests/test_preview_on_demand.py')
          s = p.read_text()
          s = s.replace('import tempfile\n', 'import tempfile\nimport threading\nimport time\n', 1)
          s += r'''


def test_parallelism_setting_validation(client):
    headers = {'X-CSRF-Token': client.csrf}
    queued = client.post('/api/scan', json={'parallelism': 4}, headers=headers)
    assert queued.status_code == 202
    job_id = queued.json['scan']['id']
    with Session() as db:
        assert db.get(Setting, f'scan_parallelism:{job_id}').value == '4'


def test_parallel_scan_executes_generated_media_concurrently(tmp_path, monkeypatch):
    photos = tmp_path / 'photos'
    photos.mkdir()
    for index in range(8):
        (photos / f'{index}.cr3').write_bytes(b'raw-' + bytes([index]))
    cache = tmp_path / 'cache'
    external = tmp_path / 'storage'
    external.mkdir()
    monkeypatch.setenv('CACHE_DIR', str(cache))
    monkeypatch.setenv('EXTERNAL_STORAGE_ROOT', str(external))
    monkeypatch.setattr(worker, 'ROOT', photos)
    monkeypatch.setattr(worker, 'CACHE', str(cache))
    monkeypatch.setattr(worker, 'metadata_batch', lambda paths: {
        str(path): {'Make': 'Canon', 'Model': 'EOS R6', 'LensModel': 'Test lens'} for path in paths
    })

    lock = threading.Lock()
    active = 0
    peak = 0

    def fake_thumbnail(path, metadata, root, key):
        nonlocal active, peak
        with lock:
            active += 1
            peak = max(peak, active)
        try:
            time.sleep(0.04)
            output = cache_file(root, key, 'thumb')
            output.parent.mkdir(parents=True, exist_ok=True)
            output.write_bytes(b'thumb')
        finally:
            with lock:
                active -= 1

    monkeypatch.setattr(worker, 'make_thumbnail', fake_thumbnail)
    with Session.begin() as db:
        job = Scan()
        db.add(job)
        db.flush()
        job_id = job.id
        db.add(Setting(key=f'scan_skip_previews:{job_id}', value='1'))
        db.add(Setting(key=f'scan_parallelism:{job_id}', value='4'))

    worker.scan(job_id)
    with Session() as db:
        job = db.get(Scan, job_id)
        assert job.state == 'done'
        assert job.indexed == 8
        assert job.errors == 0
        assert db.query(Photo).count() == 8
    assert peak >= 2
'''
          p.write_text(s)
          PY
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Python tests
        run: python -m pytest -q
      - name: JavaScript syntax
        run: node --check app/static/indexer.js
      - name: Verify parallel wiring
        run: |
          grep -q "ThreadPoolExecutor" app/worker.py
          grep -q "SCAN_PARALLELISM_PREFIX" app/worker.py
          grep -q "parallelism=data.get('parallelism', 1)" app/web.py
          grep -q 'id="parallelism"' app/static/indexer.html
          grep -q "parallelism:Number" app/static/indexer.js
      - name: Commit verified changes and remove workflow
        run: |
          rm .github/workflows/verify-parallel-indexer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/web.py app/worker.py app/static/indexer.html app/static/indexer.js app/static/indexer.css tests/test_preview_on_demand.py .github/workflows/verify-parallel-indexer.yml
          git commit -m 'Add configurable parallel indexing'
          git push
