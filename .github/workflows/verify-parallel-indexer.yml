name: Verify parallel indexer
on:
  push:
permissions:
  contents: write
jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply parallel indexer changes
        run: python tools/parallel_patch.py
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Python tests
        run: python -m pytest -q
      - name: JavaScript syntax
        run: node --check app/static/indexer.js
      - name: Verify parallel wiring
        run: |
          grep -q "ThreadPoolExecutor" app/worker.py
          grep -q "SCAN_PARALLELISM_PREFIX" app/worker.py
          grep -q "parallelism=data.get('parallelism', 1)" app/web.py
          grep -q 'id="parallelism"' app/static/indexer.html
          grep -q "parallelism:Number" app/static/indexer.js
      - name: Commit verified changes and remove helpers
        run: |
          rm .github/workflows/verify-parallel-indexer.yml tools/parallel_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/web.py app/worker.py app/static/indexer.html app/static/indexer.js app/static/indexer.css tests/test_preview_on_demand.py .github/workflows/verify-parallel-indexer.yml tools/parallel_patch.py
          git commit -m 'Add configurable parallel indexing'
          git push
