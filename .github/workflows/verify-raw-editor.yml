name: Verify RAW editor
on:
  push:
permissions:
  contents: write
jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply feature patches
        run: python apply_editor_feature.py
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Python tests
        run: python -m pytest -q
      - name: Syntax checks
        run: |
          python -m py_compile app/editor.py app/storage.py app/web.py
          node --check app/static/app.js
          node --check app/static/editor.js
          node --check app/static/edit-settings.js
      - name: Verify editor wiring
        run: |
          grep -q "editor/preview" app/web.py
          grep -q "editor/save" app/web.py
          grep -q "kind not in ('thumb', 'preview', 'original')" app/web.py
          grep -q "EDIT_FOLDER_KEY" app/storage.py
          grep -q "RAW Editor" app/static/index.html
          grep -q "EDITED JPEGS" app/static/settings.html
      - name: Commit verified feature
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/storage.py app/web.py app/static/index.html app/static/app.js app/static/settings.html
          git rm apply_editor_feature.py .github/workflows/verify-raw-editor.yml
          git commit -m 'Add downloads and non-destructive RAW editor'
          git push
