name: Extract raw-catalog source

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/extract-raw-catalog.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract source files and preserve existing files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .extract-raw
          mkdir .extract-raw
          unzip -q raw-catalog.zip -d .extract-raw

          src=.extract-raw
          mapfile -t entries < <(find .extract-raw -mindepth 1 -maxdepth 1 -printf '%f\n')
          if [ "${#entries[@]}" -eq 1 ] && [ -d ".extract-raw/${entries[0]}" ]; then
            src=".extract-raw/${entries[0]}"
          fi

          rsync -a --ignore-existing \
            --exclude='.git/' \
            --exclude='.github/workflows/extract-raw-catalog.yml' \
            "$src"/ ./

          rm -rf .extract-raw
          rm -f .github/workflows/extract-raw-catalog.yml
          rmdir --ignore-fail-on-non-empty .github/workflows .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Extract raw-catalog source files"
          git push origin HEAD:main
