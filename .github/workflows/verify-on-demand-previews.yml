name: Verify on-demand previews

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-on-demand-previews.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update existing preview mocks
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_catalog.py')
          text = path.read_text()
          text = text.replace(
              "def fake_previews(path,meta,preview_cache,key,thumbnail_cache=None,preview_edge=None):",
              "def fake_previews(path,meta,preview_cache,key,thumbnail_cache=None,preview_edge=None,preview_quality=88):")
          text = text.replace(
              "def fake_preview(path,metadata,root,cache_key,edge=None):",
              "def fake_preview(path,metadata,root,cache_key,edge=None,quality=88):")
          path.write_text(text)
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Commit verified test update and remove workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_catalog.py
          git rm .github/workflows/verify-on-demand-previews.yml
          git commit -m "Verify preview quality and on-demand generation"
          git push origin HEAD:main
