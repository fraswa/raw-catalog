name: Verify folder controls

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-folder-controls.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        run: PYTHONPATH=. python -m pytest -q
      - name: Remove temporary workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-folder-controls.yml
          git commit -m "Remove temporary verification workflow"
          git push origin HEAD:main
