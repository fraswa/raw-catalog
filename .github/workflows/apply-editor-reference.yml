name: Apply editor preview cache and editable references
on:
  push:
    branches: [main]
    paths:
      - tools/editor_reference_patch.py
      - .github/workflows/apply-editor-reference.yml
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply feature patch
        run: |
          python -c "from pathlib import Path; p=Path('tools/editor_reference_patch.py'); s=p.read_text(); s=s.replace(\"max-width:calc(100vw - 24px)}\\n'''\", \"max-width:calc(100vw - 24px)}'''\"); p.write_text(s)"
          python tools/editor_reference_patch.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Python tests
        run: python -m pytest -q
      - name: Syntax checks
        run: |
          python -m compileall -q app
          node --check app/static/editor.js
          node --check app/static/statistics.js
      - name: Verify feature wiring
        run: |
          grep -q "editor-work" app/editor.py
          grep -q "catalog_reference_overrides_v1" app/reference.py
          grep -q "/api/statistics/reference" app/web.py
          grep -q "Edit catalog facts" app/static/statistics.html
      - name: Commit verified feature and remove temporary files
        run: |
          rm -f tools/editor_reference_patch.py .github/workflows/apply-editor-reference.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Cache RAW editor previews and persist catalog reference edits"
          git push
