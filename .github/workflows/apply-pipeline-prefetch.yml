name: Apply indexer metadata prefetch pipeline
on:
  push:
    branches: [main]
    paths:
      - tools/pipeline_prefetch_patch.py
      - .github/workflows/apply-pipeline-prefetch.yml
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply pipeline patch
        run: python tools/pipeline_prefetch_patch.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Python tests
        run: python -m pytest -q
      - name: Syntax checks
        run: python -m compileall -q app tests
      - name: Verify pipeline wiring
        run: |
          grep -q "def prepare_batch" app/worker.py
          grep -q "raw-metadata" app/worker.py
          grep -q "metadata prefetch" app/worker.py
          grep -q "test_metadata_prefetch_overlaps_rendering" tests/test_preview_on_demand.py
      - name: Commit verified pipeline and remove temporary files
        run: |
          rm -f tools/pipeline_prefetch_patch.py .github/workflows/apply-pipeline-prefetch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Pipeline metadata prefetch with RAW rendering"
          git push
