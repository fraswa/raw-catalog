name: Apply gear database and statistics improvements
on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_gear_database.py'
      - '.github/workflows/apply-gear-database.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply feature patch
        run: python tools/apply_gear_database.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Python tests
        run: python -m pytest -q
      - name: Syntax checks
        run: |
          python -m compileall -q app
          node --check app/static/statistics.js
          node --check app/static/catalog.js
      - name: Verify feature wiring
        run: |
          grep -q "MACOS_GARBAGE_DIRS" app/worker.py
          grep -q "statistics_cache_v5" app/statistics.py
          grep -q "mount_breakdowns" app/statistics.py
          grep -q "/api/reference-database" app/web.py
          grep -q "sensor_type" app/reference.py
          grep -q "Gear database" app/static/catalog.html
      - name: Commit verified changes and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app tests
          git rm tools/apply_gear_database.py .github/workflows/apply-gear-database.yml
          git commit -m 'Skip macOS metadata and add gear database with mount statistics'
          git push
