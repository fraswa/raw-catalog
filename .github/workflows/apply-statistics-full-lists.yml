name: Apply statistics full camera and lens lists
on:
  push:
    branches: [main]
    paths:
      - tools/stat_full_list_patch.py
      - .github/workflows/apply-statistics-full-lists.yml
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply feature patch
        run: python tools/stat_full_list_patch.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Test
        run: python -m pytest -q
      - name: Syntax checks
        run: |
          python -m compileall -q app
          node --check app/static/statistics.js
      - name: Verify wiring
        run: |
          grep -q "statistics_cache_v4" app/statistics.py
          grep -q "showAllCameras" app/static/statistics.html
          grep -q "showAllLenses" app/static/statistics.html
          grep -q "LIST_PREVIEW_LIMIT=20" app/static/statistics.js
      - name: Commit verified change and remove temporary files
        run: |
          rm -f tools/stat_full_list_patch.py .github/workflows/apply-statistics-full-lists.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add expandable full camera and lens lists to statistics"
          git push
