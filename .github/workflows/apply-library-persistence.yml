name: Apply persistent import options, edits gallery and favorites
on:
  push:
    branches: [main]
    paths:
      - tools/persistent_options_edits_favorites_patch.py
      - .github/workflows/apply-library-persistence.yml
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix patch runner anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/persistent_options_edits_favorites_patch.py')
          text = p.read_text()
          old = '<button id=\\"closeViewer\\" aria-label=\\"Close preview\\">Close ×</button></div>\\n\"\"\"'
          new = '<button id=\\"closeViewer\\" aria-label=\\"Close preview\\">Close ×</button></div>\"\"\"'
          if old not in text:
              raise SystemExit('viewer anchor fix not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Apply feature patch
        run: python tools/persistent_options_edits_favorites_patch.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Python tests
        run: python -m pytest -q
      - name: Syntax checks
        run: |
          python -m compileall -q app
          node --check app/static/app.js
          node --check app/static/indexer.js
          node --check app/static/edits.js
      - name: Verify feature wiring
        run: |
          grep -q "favorite: Mapped\[bool\]" app/db.py
          grep -q "import_defaults_v1" app/web.py
          grep -q "/api/edits" app/web.py
          grep -q "/favorite" app/web.py
          grep -q "Favorites only" app/static/index.html
          grep -q "Browse saved edits" app/static/settings.html
          test -f app/static/edits.html
      - name: Commit verified feature and remove temporary files
        run: |
          rm -f tools/persistent_options_edits_favorites_patch.py .github/workflows/apply-library-persistence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Persist import options and add edits gallery and favorites"
          git push
