name: Fix statistics global top conflict
on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_statistics_top.py'
      - '.github/workflows/fix-statistics-top.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fix
        run: python tools/fix_statistics_top.py
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Tests
        run: python -m pytest -q
      - name: Syntax checks
        run: |
          python -m compileall -q app
          node --check app/static/statistics.js
      - name: Verify browser-safe helper name
        run: |
          ! grep -q 'function top(' app/static/statistics.js
          grep -q 'function topValues(' app/static/statistics.js
          grep -q 'statistics.js?v=8' app/static/statistics.html
      - name: Commit verified fix
        run: |
          rm -f tools/fix_statistics_top.py .github/workflows/fix-statistics-top.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix statistics browser top-name collision'
          git push
