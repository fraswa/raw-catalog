name: Fix statistics blank page
on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_statistics_blank.py'
      - '.github/workflows/fix-statistics-blank.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fix
        run: python tools/fix_statistics_blank.py
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Tests
        run: python -m pytest -q
      - name: Syntax checks
        run: |
          python -m compileall -q app
          node --check app/static/statistics.js
      - name: Verify cache safety
        run: |
          grep -q "must-revalidate" app/web.py
          grep -q "statistics.js?v=6" app/static/statistics.html
          grep -q "function bind" app/static/statistics.js
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          git rm tools/fix_statistics_blank.py .github/workflows/fix-statistics-blank.yml
          git commit -m 'Prevent stale statistics assets from causing blank page'
          git push
